<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood Core</title>

<style>
*{
    padding:0;
    margin:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

  
    background:linear-gradient(
        135deg,
        #ffd6e8,
        #ffc6d7,
        #ffb3d1,
        #f8d8ff
    );

    position:relative;
}


.meme{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    
}

img{
    height:70vh;
    padding:70px;
    
}

h1{
    color:grey;
    font-size:50px;
    letter-spacing:5px;
    font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    text-shadow:2px 2px 10px rgba(255,255,255,.7);
}
</style>

</head>
<body>

<div class="meme">
    <h1>MOOD CORE</h1>
    <img src="meme1.png" alt="meme">
</div>

</body>
</html>
